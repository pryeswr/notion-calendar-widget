<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Mini Calendar for Notion</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            notion: {
              lightBg: '#FFFFFF',
              lightCard: '#F7F7F5',
              lightBorder: '#E9E9E7',
              lightText: '#37352F',
              lightMuted: '#787774',
              
              darkBg: '#191919',
              darkCard: '#202020',
              darkBorder: '#2F2F2F',
              darkText: '#D4D4D4',
              darkMuted: '#9B9B9B',

              accent: '#8B5CF6', // Gentle lavender accent
              accentLight: '#DDD6FE',
              accentDark: '#6D28D9'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom Scrollbar for Event Modal */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 4px;
    }
    /* Subtle Animations */
    .fade-in {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-notion-lightBg dark:bg-notion-darkBg text-notion-lightText dark:text-notion-darkText transition-colors duration-200 min-h-screen p-3 sm:p-4 flex flex-col items-center justify-center">

  <!-- Main Container -->
  <div class="w-full max-w-[340px] bg-notion-lightCard dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder rounded-2xl p-4 shadow-sm relative overflow-hidden fade-in">
    
    <!-- Top Bar Navigation & Controls -->
    <div class="flex items-center justify-between mb-4">
      <!-- Month & Year -->
      <div class="flex items-baseline space-x-1.5">
        <h2 id="monthLabel" class="font-display font-bold text-lg tracking-tight text-notion-lightText dark:text-notion-darkText"></h2>
        <span id="yearLabel" class="text-xs font-medium text-notion-lightMuted dark:text-notion-darkMuted"></span>
      </div>

      <!-- Controls Right -->
      <div class="flex items-center space-x-1">
        <!-- Today Button -->
        <button id="todayBtn" title="Go to Today" class="px-2 py-1 text-xs font-semibold rounded-lg bg-notion-lightBorder/50 dark:bg-notion-darkBorder/60 hover:bg-notion-accent/20 dark:hover:bg-notion-accent/30 text-notion-lightText dark:text-notion-darkText transition-all">
          Today
        </button>

        <!-- Previous Month -->
        <button id="prevBtn" title="Previous Month" class="p-1 rounded-lg text-notion-lightMuted dark:text-notion-darkMuted hover:text-notion-lightText dark:hover:text-notion-darkText hover:bg-notion-lightBorder/50 dark:hover:bg-notion-darkBorder transition-all">
          <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>

        <!-- Next Month -->
        <button id="nextBtn" title="Next Month" class="p-1 rounded-lg text-notion-lightMuted dark:text-notion-darkMuted hover:text-notion-lightText dark:hover:text-notion-darkText hover:bg-notion-lightBorder/50 dark:hover:bg-notion-darkBorder transition-all">
          <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" title="Toggle Theme" class="p-1 ml-1 rounded-lg text-notion-lightMuted dark:text-notion-darkMuted hover:text-notion-lightText dark:hover:text-notion-darkText hover:bg-notion-lightBorder/50 dark:hover:bg-notion-darkBorder transition-all">
          <i id="themeIcon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Weekday Headers -->
    <div class="grid grid-cols-7 gap-1 mb-2 text-center">
      <span class="text-[11px] font-semibold text-red-400/80">Su</span>
      <span class="text-[11px] font-semibold text-notion-lightMuted dark:text-notion-darkMuted">Mo</span>
      <span class="text-[11px] font-semibold text-notion-lightMuted dark:text-notion-darkMuted">Tu</span>
      <span class="text-[11px] font-semibold text-notion-lightMuted dark:text-notion-darkMuted">We</span>
      <span class="text-[11px] font-semibold text-notion-lightMuted dark:text-notion-darkMuted">Th</span>
      <span class="text-[11px] font-semibold text-notion-lightMuted dark:text-notion-darkMuted">Fr</span>
      <span class="text-[11px] font-semibold text-notion-lightMuted dark:text-notion-darkMuted">Sa</span>
    </div>

    <!-- Calendar Grid -->
    <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-xs">
      <!-- Dynamically populated -->
    </div>

    <!-- Footer Summary Info -->
    <div class="mt-3 pt-2.5 border-t border-notion-lightBorder/60 dark:border-notion-darkBorder/60 flex justify-between items-center text-[11px] text-notion-lightMuted dark:text-notion-darkMuted">
      <span id="activeNotesSummary">0 upcoming events</span>
      <span class="italic text-[10px] opacity-75">Notion Widget</span>
    </div>
  </div>

  <!-- Note/Event Details Drawer (Modal) -->
  <div id="eventModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
    <div id="modalContent" class="bg-notion-lightBg dark:bg-notion-darkCard border border-notion-lightBorder dark:border-notion-darkBorder rounded-2xl w-full max-w-[310px] p-4 shadow-xl transform scale-95 transition-transform duration-200">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between pb-2 mb-3 border-b border-notion-lightBorder dark:border-notion-darkBorder">
        <div>
          <h3 id="modalDateTitle" class="font-display font-bold text-sm text-notion-lightText dark:text-notion-darkText">Selected Date</h3>
          <p id="modalDaySub" class="text-[11px] text-notion-lightMuted dark:text-notion-darkMuted"></p>
        </div>
        <button id="closeModalBtn" class="p-1 rounded-lg text-notion-lightMuted hover:text-notion-lightText dark:hover:text-notion-darkText hover:bg-notion-lightBorder dark:hover:bg-notion-darkBorder">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Existing Events List -->
      <div id="eventsList" class="space-y-1.5 max-h-36 overflow-y-auto mb-3 pr-1">
        <!-- Event items dynamically loaded -->
      </div>

      <!-- Add New Event Input -->
      <form id="addEventForm" class="flex gap-1.5 pt-2 border-t border-notion-lightBorder/50 dark:border-notion-darkBorder/50">
        <input 
          type="text" 
          id="eventInput" 
          placeholder="Add quick note..." 
          required 
          maxlength="40"
          class="flex-1 bg-notion-lightCard dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder text-xs text-notion-lightText dark:text-notion-darkText rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-notion-accent"
        />
        <button 
          type="submit" 
          class="bg-notion-accent hover:bg-notion-accentDark text-white p-1.5 rounded-lg flex items-center justify-center transition-colors"
        >
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </form>

    </div>
  </div>

  <script>
    // State Variables
    let currentDate = new Date();
    let selectedDateStr = null;
    let events = JSON.parse(localStorage.getItem('notion_calendar_events') || '{}');

    // DOM Elements
    const monthLabel = document.getElementById('monthLabel');
    const yearLabel = document.getElementById('yearLabel');
    const calendarGrid = document.getElementById('calendarGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const todayBtn = document.getElementById('todayBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const activeNotesSummary = document.getElementById('activeNotesSummary');

    // Modal DOM Elements
    const eventModal = document.getElementById('eventModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalDateTitle = document.getElementById('modalDateTitle');
    const modalDaySub = document.getElementById('modalDaySub');
    const eventsList = document.getElementById('eventsList');
    const addEventForm = document.addEventForm || document.getElementById('addEventForm');
    const eventInput = document.getElementById('eventInput');

    // Month Names
    const monthNames = [
      "January", "February", "March", "April", "May", "June", 
      "July", "August", "September", "October", "November", "December"
    ];

    // Initialize App
    function init() {
      setupTheme();
      renderCalendar();
      setupEventListeners();
      lucide.createIcons();
    }

    // Setup Theme Mode (System default or saved preference)
    function setupTheme() {
      const savedTheme = localStorage.getItem('notion_calendar_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      }
      lucide.createIcons();
    }

    // Toggle Light/Dark Mode
    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('notion_calendar_theme', isDark ? 'dark' : 'light');
      themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    });

    // Render Calendar Logic
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      // Set Header Labels
      monthLabel.textContent = monthNames[month];
      yearLabel.textContent = year;

      // Get first day of month and total days in month
      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevMonthTotalDays = new Date(year, month, 0).getDate();

      const today = new Date();
      const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

      calendarGrid.innerHTML = '';

      // Previous Month Filler Days
      for (let i = firstDayIndex - 1; i >= 0; i--) {
        const dayNum = prevMonthTotalDays - i;
        const dayEl = createDayElement(dayNum, 'text-notion-lightMuted/40 dark:text-notion-darkMuted/30 cursor-default');
        calendarGrid.appendChild(dayEl);
      }

      // Current Month Days
      let totalNotesThisMonth = 0;
      for (let day = 1; day <= totalDays; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = isCurrentMonth && day === today.getDate();
        const hasEvents = events[dateKey] && events[dateKey].length > 0;

        if (hasEvents) {
          totalNotesThisMonth += events[dateKey].length;
        }

        const dayEl = document.createElement('button');
        dayEl.className = `relative aspect-square flex flex-col items-center justify-center rounded-xl font-medium text-xs transition-all duration-150 focus:outline-none hover:bg-notion-lightBorder/60 dark:hover:bg-notion-darkBorder/60 ${
          isToday 
            ? 'bg-notion-accent text-white font-bold shadow-sm hover:bg-notion-accentDark' 
            : 'text-notion-lightText dark:text-notion-darkText'
        }`;

        dayEl.innerHTML = `
          <span>${day}</span>
          ${hasEvents ? `<span class="absolute bottom-1 w-1 h-1 rounded-full ${isToday ? 'bg-white' : 'bg-notion-accent'}"></span>` : ''}
        `;

        dayEl.addEventListener('click', () => openModal(dateKey, day, month, year));
        calendarGrid.appendChild(dayEl);
      }

      // Next Month Filler Days (to complete 6 rows = 42 cells total for consistent grid height)
      const totalGridCells = calendarGrid.children.length;
      const remainingCells = 42 - totalGridCells;
      for (let day = 1; day <= remainingCells; day++) {
        const dayEl = createDayElement(day, 'text-notion-lightMuted/40 dark:text-notion-darkMuted/30 cursor-default');
        calendarGrid.appendChild(dayEl);
      }

      // Update summary counter
      activeNotesSummary.textContent = `${totalNotesThisMonth} event${totalNotesThisMonth === 1 ? '' : 's'} this month`;
    }

    // Helper for generating non-interactive filler day elements
    function createDayElement(text, customClasses) {
      const el = document.createElement('div');
      el.className = `aspect-square flex items-center justify-center text-xs font-normal ${customClasses}`;
      el.textContent = text;
      return el;
    }

    // Open Event Modal
    function openModal(dateKey, day, month, year) {
      selectedDateStr = dateKey;
      const dateObj = new Date(year, month, day);
      
      const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
      modalDateTitle.textContent = `${monthNames[month]} ${day}, ${year}`;
      modalDaySub.textContent = dayName;

      renderEventsList();

      eventModal.classList.remove('hidden');
      setTimeout(() => {
        eventModal.classList.remove('opacity-0');
        modalContent.classList.remove('scale-95');
      }, 10);

      eventInput.focus();
    }

    // Close Event Modal
    function closeModal() {
      eventModal.classList.add('opacity-0');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        eventModal.classList.add('hidden');
        selectedDateStr = null;
        eventInput.value = '';
      }, 200);
    }

    // Render Events inside Modal
    function renderEventsList() {
      eventsList.innerHTML = '';
      const dateEvents = events[selectedDateStr] || [];

      if (dateEvents.length === 0) {
        eventsList.innerHTML = `<p class="text-xs text-notion-lightMuted dark:text-notion-darkMuted italic text-center py-2">No notes for this date.</p>`;
        return;
      }

      dateEvents.forEach((evText, index) => {
        const evItem = document.createElement('div');
        evItem.className = 'flex items-center justify-between bg-notion-lightCard dark:bg-notion-darkBg border border-notion-lightBorder dark:border-notion-darkBorder rounded-lg px-2.5 py-1.5 text-xs group';
        
        evItem.innerHTML = `
          <span class="text-notion-lightText dark:text-notion-darkText break-all pr-2">${escapeHtml(evText)}</span>
          <button onclick="deleteEvent(${index})" class="text-notion-lightMuted hover:text-red-500 opacity-80 group-hover:opacity-100 transition-opacity p-0.5">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        eventsList.appendChild(evItem);
      });

      lucide.createIcons();
    }

    // Add New Event
    addEventForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = eventInput.value.trim();
      if (!val || !selectedDateStr) return;

      if (!events[selectedDateStr]) {
        events[selectedDateStr] = [];
      }

      events[selectedDateStr].push(val);
      localStorage.setItem('notion_calendar_events', JSON.stringify(events));

      eventInput.value = '';
      renderEventsList();
      renderCalendar();
    });

    // Delete Event
    window.deleteEvent = function(index) {
      if (!selectedDateStr || !events[selectedDateStr]) return;
      events[selectedDateStr].splice(index, 1);
      
      if (events[selectedDateStr].length === 0) {
        delete events[selectedDateStr];
      }

      localStorage.setItem('notion_calendar_events', JSON.stringify(events));
      renderEventsList();
      renderCalendar();
    };

    // Helper: Prevent XSS in HTML string
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // Setup Event Listeners for Navigation
    function setupEventListeners() {
      prevBtn.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
      });

      nextBtn.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
      });

      todayBtn.addEventListener('click', () => {
        currentDate = new Date();
        renderCalendar();
      });

      closeModalBtn.addEventListener('click', closeModal);

      // Close modal on backdrop click
      eventModal.addEventListener('click', (e) => {
        if (e.target === eventModal) closeModal();
      });

      // Escape key to close modal
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !eventModal.classList.contains('hidden')) {
          closeModal();
        }
      });
    }

    // Initialize on load
    window.onload = init;
  </script>
</body>
</html>
